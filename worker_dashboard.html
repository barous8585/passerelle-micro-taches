<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passerelle — Espace étudiant</title>
<style>
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --border-strong: #CBD5E1;
    --text: #0F172A;
    --text-secondary: #64748B;
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --success: #16A34A;
    --success-bg: #F0FDF4;
    --danger: #DC2626;
    --danger-bg: #FEF2F2;
    --warning: #D97706;
    --warning-bg: #FFFBEB;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }

  .topbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 5;
  }

  .topbar .logo { font-weight: 600; font-size: 15px; }

  .stats { display: flex; gap: 20px; }
  .stat { text-align: right; }
  .stat .valeur { font-weight: 600; font-size: 15px; }
  .stat.argent .valeur { color: var(--success); }
  .stat .label { font-size: 11px; color: var(--text-secondary); }

  .conteneur { max-width: 1100px; margin: 0 auto; padding: 24px; }

  .grille {
    display: grid;
    grid-template-columns: 340px 1fr;
    grid-template-areas: "projets tache" "historique tache";
    gap: 20px;
    align-items: start;
  }
  @media (max-width: 860px) {
    .grille { grid-template-columns: 1fr; grid-template-areas: "tache" "projets" "historique"; }
  }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 14px; text-transform: none; }
  .panel-projets { grid-area: projets; }
  .panel-tache { grid-area: tache; }
  .panel-historique { grid-area: historique; }

  label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  input[type=email], input[type=password], input[type=text] {
    width: 100%; padding: 8px 10px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border-strong); border-radius: 6px; margin-bottom: 12px; background: #fff;
  }
  input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

  .rang { display: flex; gap: 8px; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 500; padding: 8px 14px;
    border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text); cursor: pointer;
  }
  button:hover { background: var(--bg); }
  button.principal { background: var(--primary); color: #fff; border-color: var(--primary); }
  button.principal:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.5; cursor: default; }

  .item-projet {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); cursor: pointer; text-align: left; width: 100%; margin-bottom: 8px;
  }
  .item-projet.actif { border-color: var(--primary); background: #EFF6FF; }
  .item-projet .titre { font-weight: 500; font-size: 13px; }
  .item-projet .sousinfo { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }
  .item-projet .prix { font-family: var(--mono); font-size: 12px; color: var(--success); }

  .vide { text-align: center; padding: 24px 10px; color: var(--text-secondary); font-size: 13px; }

  .ligne-info { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
  .ligne-info .pos { font-size: 12px; color: var(--text-secondary); }
  .ligne-info .prix-ligne { font-family: var(--mono); font-size: 13px; color: var(--success); font-weight: 600; }

  .champ { margin-bottom: 16px; }
  .champ .nom-colonne { font-size: 11px; color: var(--text-secondary); margin-bottom: 4px; font-weight: 500; }
  .champ .brut {
    font-family: var(--mono); font-size: 12px; color: var(--text-secondary);
    background: var(--bg); border: 1px dashed var(--border-strong); border-radius: 5px;
    padding: 5px 8px; margin-bottom: 6px; word-break: break-word;
  }
  .badges { margin-bottom: 6px; display: flex; flex-wrap: wrap; gap: 5px; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 500; }
  .badge.danger { background: var(--danger-bg); color: var(--danger); }
  .badge.warning { background: var(--warning-bg); color: var(--warning); }
  .badge.info { background: #EFF6FF; color: var(--primary); }

  .champ input[type=text] {
    width: 100%; padding: 9px 10px; font-family: var(--mono); font-size: 13px;
    border: 1.5px solid var(--border-strong); border-radius: 6px; background: #fff; margin-bottom: 0;
  }
  .champ input.a-corriger { border-color: var(--danger); }
  .champ input.a-verifier { border-color: var(--warning); }

  .actions-tache { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--border); }

  .msg { font-size: 12px; color: var(--text-secondary); margin: 8px 0 0; }

  .registre { display: flex; flex-direction: column; }
  .ligne-registre { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  .ligne-registre:last-child { border-bottom: none; }
  .ligne-registre .montant { font-family: var(--mono); }
  .ligne-registre.paye .montant { color: var(--success); }
  .ligne-registre.attente .montant { color: var(--text-secondary); }

  .filtres { display: flex; gap: 6px; margin-bottom: 10px; }
  .filtres button { padding: 5px 10px; font-size: 12px; }
  .filtres button.actif { background: var(--primary); color: #fff; border-color: var(--primary); }
</style>
</head>
<body>

  <div class="topbar">
    <div class="logo">Passerelle — espace étudiant</div>
    <div class="stats">
      <div class="stat argent"><div class="valeur" id="stat_solde">— €</div><div class="label">solde disponible</div></div>
      <div class="stat"><div class="valeur" id="stat_confiance">—</div><div class="label">indice de confiance</div></div>
    </div>
  </div>

  <div class="conteneur">

    <div class="panel" id="bloc_auth" style="max-width:400px; margin-bottom:20px;">
      <h2>Connexion étudiant</h2>
      <label>Email</label>
      <input type="email" id="auth_email" value="etudiant1@uco.fr">
      <p class="msg" style="margin:-8px 0 12px;">Inscription réservée aux emails @uco.fr pour le moment</p>
      <label>Mot de passe</label>
      <input type="password" id="auth_password" value="motdepasse123">
      <label style="display:flex; align-items:flex-start; gap:6px; font-size:12px; color:var(--text-secondary); margin-bottom:12px; cursor:pointer;">
        <input type="checkbox" id="auth_confidentialite" style="margin-top:2px; width:auto;">
        <span>Je m'engage à ne pas copier, exporter, capturer ou partager les données que je traite sur cette plateforme, en dehors de l'usage prévu (correction en ligne).</span>
      </label>
      <div class="rang">
        <button onclick="creerCompte()">Créer un compte</button>
        <button class="principal" onclick="seConnecter()">Se connecter</button>
      </div>
      <p class="msg" id="auth_msg"></p>
    </div>

    <div class="grille" id="grille_principale" style="display:none;">

      <div class="panel panel-projets">
        <h2>Projets disponibles</h2>
        <div id="liste_projets"></div>
      </div>

      <div class="panel panel-tache" id="zone_tache">
        <div class="vide">Choisis un projet pour commencer.</div>
      </div>

      <div class="panel panel-historique">
        <h2>Historique</h2>
        <div class="filtres">
          <button class="actif" data-filtre="tous" onclick="filtrerHistorique('tous')">Tout</button>
          <button data-filtre="paye" onclick="filtrerHistorique('paye')">Payées</button>
          <button data-filtre="attente" onclick="filtrerHistorique('attente')">En attente</button>
        </div>
        <div class="registre" id="liste_historique"></div>
        <p class="msg" id="eligibilite_versement"></p>
      </div>

    </div>

  </div>

<script>
let authHeader = sessionStorage.getItem('passerelle_auth') || null;
let tacheCourante = null;
let projetCourant = null;
let historiqueComplet = [];

function construireAuthHeader(email, motdepasse) { return 'Basic ' + btoa(email + ':' + motdepasse); }

async function creerCompte() {
  const email = document.getElementById('auth_email').value;
  const password = document.getElementById('auth_password').value;
  const accepte_confidentialite = document.getElementById('auth_confidentialite').checked;
  const msg = document.getElementById('auth_msg');
  const res = await fetch('/auth/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, role: 'worker', accepte_confidentialite }),
  });
  msg.textContent = res.ok ? 'Compte créé — connecte-toi.' : (await res.json()).detail;
}

async function seConnecter() {
  await tenterConnexion(construireAuthHeader(document.getElementById('auth_email').value, document.getElementById('auth_password').value));
}

async function tenterConnexion(header) {
  const msg = document.getElementById('auth_msg');
  const res = await fetch('/auth/me', { headers: { Authorization: header } });
  if (!res.ok) { msg.textContent = 'Email ou mot de passe incorrect.'; sessionStorage.removeItem('passerelle_auth'); return; }
  const moi = await res.json();
  if (moi.role !== 'worker') { msg.textContent = "Ce compte n'est pas un compte étudiant."; return; }

  authHeader = header;
  sessionStorage.setItem('passerelle_auth', header);
  document.getElementById('bloc_auth').style.display = 'none';
  document.getElementById('grille_principale').style.display = 'grid';
  document.getElementById('stat_confiance').textContent = moi.trust_score + '/100';
  chargerProjetsDisponibles();
  actualiserHistorique();
}

if (authHeader) tenterConnexion(authHeader);

async function chargerProjetsDisponibles() {
  const res = await fetch('/projects/available', { headers: { Authorization: authHeader } });
  if (!res.ok) return;
  const data = await res.json();
  const liste = document.getElementById('liste_projets');

  if (!data.projets.length) { liste.innerHTML = '<div class="vide">Aucun projet disponible.</div>'; return; }

  liste.innerHTML = data.projets.map(p => `
    <button class="item-projet ${p.project_id === projetCourant ? 'actif' : ''}" onclick="choisirProjet(${p.project_id})">
      <div><div class="titre">${p.titre}</div><div class="sousinfo">${p.taches_disponibles} ligne(s) disponible(s)</div></div>
      <div class="prix">${p.prix_par_ligne.toFixed(2)} €</div>
    </button>
  `).join('');
}

function choisirProjet(id) { projetCourant = id; chargerProjetsDisponibles(); chargerTacheSuivante(); }

function badgesParColonne(badges) {
  const parColonne = {};
  for (const b of badges) { (parColonne[b.col_index] ??= []).push(b); }
  return parColonne;
}

function escapeHtml(s) { return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function chargerTacheSuivante() {
  const zone = document.getElementById('zone_tache');
  const res = await fetch(`/tasks/next?project_id=${projetCourant}`, { headers: { Authorization: authHeader } });

  if (res.status === 404) {
    zone.innerHTML = '<div class="vide">Plus de tâche disponible sur ce projet pour le moment.</div>';
    tacheCourante = null;
    return;
  }
  if (!res.ok) { zone.innerHTML = '<div class="vide">Erreur de chargement.</div>'; return; }

  tacheCourante = await res.json();
  afficherTache(tacheCourante);
}

function afficherTache(tache) {
  const zone = document.getElementById('zone_tache');
  const badgesCol = badgesParColonne(tache.badges || []);

  let html = `<div class="ligne-info"><span class="pos">Ligne #${tache.row_id}</span><span class="prix-ligne">+${tache.prix.toFixed(2)} €</span></div>`;

  tache.header.forEach((nomColonne, i) => {
    const valeurBrute = tache.raw_data[i] ?? '';
    const badgesIci = badgesCol[i] || [];
    const classeInput = badgesIci.some(b => b.type === 'danger') ? 'a-corriger' : badgesIci.some(b => b.type === 'warning') ? 'a-verifier' : '';
    html += `
      <div class="champ">
        <div class="nom-colonne">${nomColonne}</div>
        <div class="brut">${escapeHtml(valeurBrute)}</div>
        ${badgesIci.length ? `<div class="badges">${badgesIci.map(b => `<span class="badge ${b.type}">${b.msg}</span>`).join('')}</div>` : ''}
        <input type="text" class="${classeInput}" data-col="${i}" value="${escapeHtml(valeurBrute).trim()}">
      </div>`;
  });

  html += `<div class="actions-tache"><button onclick="libererEtPasser()">Passer</button><button class="principal" onclick="validerTache()">Valider</button></div>
           <p class="msg" id="msg"></p>`;
  zone.innerHTML = html;
}

async function libererEtPasser() {
  if (tacheCourante) await fetch(`/tasks/${tacheCourante.task_id}/release`, { method: 'POST', headers: { Authorization: authHeader } });
  chargerTacheSuivante();
}

async function validerTache() {
  if (!tacheCourante) return;
  const inputs = document.querySelectorAll('#zone_tache input[data-col]');
  const reponse = new Array(inputs.length);
  inputs.forEach(inp => { reponse[parseInt(inp.dataset.col, 10)] = inp.value; });

  const res = await fetch(`/tasks/${tacheCourante.task_id}/submit`, {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: authHeader },
    body: JSON.stringify({ reponse }),
  });

  if (!res.ok) { document.getElementById('msg').textContent = "Erreur lors de l'envoi."; return; }
  const data = await res.json();

  actualiserHistorique();
  const moiRes = await fetch('/auth/me', { headers: { Authorization: authHeader } });
  if (moiRes.ok) document.getElementById('stat_confiance').textContent = (await moiRes.json()).trust_score + '/100';

  chargerTacheSuivante();
}

async function actualiserHistorique() {
  const res = await fetch('/tasks/mine', { headers: { Authorization: authHeader } });
  if (!res.ok) return;
  const data = await res.json();
  document.getElementById('stat_solde').textContent = data.solde_disponible.toFixed(2).replace('.', ',') + ' €';
  historiqueComplet = data.historique;
  rendreHistorique('tous');
  document.getElementById('eligibilite_versement').textContent = data.eligible_versement
    ? `Seuil de ${data.seuil_decaissement.toFixed(2)} € atteint — versement à venir.`
    : `Versement groupé à partir de ${data.seuil_decaissement.toFixed(2)} € cumulés.`;
}

function filtrerHistorique(filtre) {
  document.querySelectorAll('.filtres button').forEach(b => b.classList.toggle('actif', b.dataset.filtre === filtre));
  rendreHistorique(filtre);
}

function rendreHistorique(filtre) {
  const liste = document.getElementById('liste_historique');
  const lignes = historiqueComplet.filter(h => filtre === 'tous' || h.statut.startsWith(filtre === 'paye' ? 'paye' : 'en_attente'));
  liste.innerHTML = lignes.length ? lignes.map(h => `
    <div class="ligne-registre ${h.statut === 'paye' ? 'paye' : 'attente'}">
      <span>${h.statut === 'paye' ? 'Ligne validée' : 'En vérification'}</span>
      <span class="montant">${h.montant !== null ? '+' + h.montant.toFixed(2) + ' €' : '…'}</span>
    </div>`).join('') : '<div class="vide">Rien à afficher.</div>';
}
</script>
</body>
</html>
