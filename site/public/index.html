<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<script src="/shim.js"></script>
<title>Notre château</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
  /* Concept : un château de nuit qui grandit avec le couple — bleu nuit, or des bougies, rose du cœur. Un seul univers sombre, assumé. */
  :root {
    --night: #0b0f22;
    --night-2: #141a33;
    --glass: rgba(12, 15, 32, 0.74);
    --ivory: #f6f1e7;
    --muted: rgba(246, 241, 231, 0.62);
    --gold: #d6b26e;
    --gold-soft: rgba(214, 178, 110, 0.34);
    --rose: #e6a3b3;
    --paper: #f8f3ea;
    --paper-ink: #2a241d;
    --paper-muted: #7a6c58;
    --danger: #e58f8f;
    --display: "Cormorant Garamond", Georgia, "Times New Roman", serif;
    --body: "Jost", "Avenir Next", "Segoe UI", system-ui, sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0; overflow: hidden; background: var(--night); color: var(--ivory);
    font-family: var(--body); font-weight: 300;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  button, input, textarea, select { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ─── Accueil ─── */
  #intro {
    position: fixed; inset: 0; z-index: 60; overflow-y: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0;
    padding: max(28px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(28px, env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
    text-align: center;
    background: radial-gradient(ellipse 80% 60% at 50% 30%, #1c2450 0%, var(--night) 70%);
    transition: opacity 1.4s ease, visibility 1.4s ease;
  }
  #intro.gone { opacity: 0; visibility: hidden; }
  #introStars { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #intro > *:not(canvas) { position: relative; }
  .kicker { font-size: 11px; letter-spacing: .42em; text-transform: uppercase; color: var(--gold); }
  #introNames { font-family: var(--display); font-weight: 400; font-size: clamp(44px, 9vw, 92px); line-height: 1; margin: 18px 0 8px; text-wrap: balance; }
  #introNames em { color: var(--gold); font-style: italic; }
  #introDays { font-family: var(--display); font-style: italic; font-size: clamp(18px, 2.6vw, 23px); color: var(--muted); min-height: 1.4em; }
  #introDays strong { color: var(--rose); font-weight: 500; }
  .rule { width: min(240px, 60vw); height: 1px; margin: 24px auto; background: linear-gradient(90deg, transparent, var(--gold), transparent); }
  #gate { display: flex; flex-direction: column; align-items: center; gap: 14px; width: min(380px, 100%); }
  #codeInput {
    width: 100%; text-align: center; letter-spacing: .5em; font-size: 20px; padding: 14px 16px;
    background: rgba(255,255,255,.04); border: 1px solid var(--gold-soft); border-radius: 999px; color: var(--ivory);
  }
  #codeInput::placeholder { letter-spacing: .12em; color: rgba(246,241,231,.38); font-size: 14px; }
  #codeInput.shake { animation: shake .4s; border-color: var(--danger); }
  @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
  .btn-primary {
    border: 1px solid var(--gold-soft); background: rgba(214,178,110,.08); border-radius: 999px;
    padding: 15px 34px; font-size: 13px; letter-spacing: .16em; text-transform: uppercase;
    transition: background .4s, border-color .4s, transform .4s;
  }
  .btn-primary:hover:not(:disabled) { background: rgba(214,178,110,.2); border-color: var(--gold); transform: translateY(-1px); }
  .btn-primary:disabled { opacity: .5; cursor: wait; }
  .check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
  #introNote { margin-top: 22px; font-size: 12px; color: rgba(246,241,231,.42); letter-spacing: .05em; max-width: 440px; line-height: 1.6; }
  #setup { display: none; flex-direction: column; gap: 12px; width: min(420px, 100%); text-align: left; }
  #setup.on { display: flex; }
  #setup h2 { font-family: var(--display); font-weight: 500; font-style: italic; font-size: 26px; margin: 0 0 4px; text-align: center; }
  .field { display: flex; flex-direction: column; gap: 6px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .field input, .field textarea, .field select {
    text-transform: none; letter-spacing: normal; font-size: 15px; color: var(--ivory);
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.14); border-radius: 10px; padding: 11px 13px;
  }
  .field textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  .field select option { background: var(--night-2); }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .link-btn { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }

  /* ─── HUD ─── */
  .hud { position: fixed; z-index: 20; opacity: 0; pointer-events: none; transition: opacity 1s; }
  body.entered .hud { opacity: 1; }
  #brand { top: max(16px, env(safe-area-inset-top, 0px)); left: max(18px, env(safe-area-inset-left, 0px)); text-shadow: 0 1px 14px rgba(0,0,0,.5); }
  #brandNames { font-family: var(--display); font-size: 19px; letter-spacing: .04em; }
  #brandPlace { font-size: 10px; letter-spacing: .36em; text-transform: uppercase; color: var(--gold); margin-top: 3px; transition: opacity .6s; }
  #hintBox {
    top: max(16px, env(safe-area-inset-top, 0px)); right: max(18px, env(safe-area-inset-right, 0px));
    max-width: 260px; text-align: right; font-size: 12px; line-height: 1.65; padding: 10px 14px;
    background: var(--glass); border: 1px solid rgba(255,255,255,.08); border-radius: 12px;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  body.entered #hintBox.fade { opacity: 0; }
  #toolbar {
    bottom: max(18px, env(safe-area-inset-bottom, 0px)); right: max(18px, env(safe-area-inset-right, 0px));
    display: flex; gap: 10px; pointer-events: auto;
  }
  .tool {
    height: 46px; min-width: 46px; padding: 0 16px; border-radius: 999px; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    background: var(--glass); border: 1px solid rgba(255,255,255,.14); font-size: 13px; letter-spacing: .06em;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: border-color .3s;
  }
  .tool:hover { border-color: var(--gold); }
  .tool.off { opacity: .5; }
  #atelierBtn[hidden] { display: none !important; }
  #standBtn {
    bottom: max(26px, env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%);
    pointer-events: auto; padding: 13px 28px; border-radius: 999px; display: none;
    background: var(--glass); border: 1px solid var(--gold-soft); font-size: 13px; letter-spacing: .14em; text-transform: uppercase;
  }
  body.seated #standBtn { display: block; }
  #tooltip {
    position: fixed; z-index: 25; left: 50%; bottom: max(84px, calc(env(safe-area-inset-bottom, 0px) + 72px));
    transform: translate(-50%, 14px); opacity: 0; pointer-events: none;
    width: min(440px, calc(100vw - 32px)); padding: 16px 20px 18px; border-radius: 16px;
    background: var(--glass); border: 1px solid rgba(214,178,110,.26);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transition: opacity .4s, transform .4s;
  }
  #tooltip.show { opacity: 1; transform: translate(-50%, 0); }
  #tipDate { font-size: 10.5px; letter-spacing: .3em; text-transform: uppercase; color: var(--gold); }
  #tipTitle { font-family: var(--display); font-style: italic; font-size: 25px; line-height: 1.15; margin: 4px 0 6px; }
  #tipStory { font-size: 13.5px; line-height: 1.6; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  #pill {
    position: fixed; z-index: 24; left: 50%; bottom: max(90px, calc(env(safe-area-inset-bottom, 0px) + 78px));
    transform: translate(-50%, 10px); opacity: 0; pointer-events: none; white-space: nowrap; max-width: calc(100vw - 32px); overflow: hidden; text-overflow: ellipsis;
    padding: 10px 20px; border-radius: 999px; font-size: 13px; background: var(--glass); border: 1px solid var(--gold-soft);
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); transition: opacity .35s, transform .35s;
  }
  #pill.show { opacity: 1; transform: translate(-50%, 0); }
  #benchMsg {
    position: fixed; z-index: 22; left: 50%; top: 13%; transform: translateX(-50%); width: min(560px, calc(100vw - 40px));
    text-align: center; pointer-events: none; white-space: pre-line;
    font-family: var(--display); font-style: italic; font-size: clamp(21px, 3vw, 29px); line-height: 1.45; color: #fff;
    text-shadow: 0 2px 24px rgba(0,0,0,.7); opacity: 0; transition: opacity 2.2s;
  }
  #benchMsg.show { opacity: 1; }
  #together { font-size: 12px; color: var(--rose); margin-top: 8px; letter-spacing: .02em; max-width: 70vw; }
  #hearts { position: fixed; inset: 0; pointer-events: none; z-index: 66; overflow: hidden; }
  #hearts span { position: absolute; bottom: -40px; font-size: 30px; animation: floatUp 3.4s ease-out forwards; }
  @keyframes floatUp { 0% { transform: translateY(0) scale(.6); opacity: 0; } 15% { opacity: 1; } 100% { transform: translateY(-92vh) scale(1.25) rotate(var(--r, 0deg)); opacity: 0; } }
  #heartBtn[hidden] { display: none !important; }
  #toast {
    position: fixed; z-index: 70; left: 50%; top: max(18px, env(safe-area-inset-top, 0px)); transform: translate(-50%, -10px);
    opacity: 0; pointer-events: none; padding: 10px 18px; border-radius: 999px; font-size: 13px;
    background: var(--paper); color: var(--paper-ink); box-shadow: 0 10px 30px rgba(0,0,0,.35); transition: opacity .35s, transform .35s;
    max-width: calc(100vw - 32px);
  }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }
  #fade { position: fixed; inset: 0; z-index: 30; background: #000; opacity: 0; pointer-events: none; transition: opacity .45s; }
  #fade.on { opacity: 1; }

  /* Joystick tactile */
  #joy {
    left: max(22px, env(safe-area-inset-left, 0px)); bottom: max(22px, env(safe-area-inset-bottom, 0px)); width: 128px; height: 128px; border-radius: 50%;
    pointer-events: auto; display: none; touch-action: none; user-select: none; -webkit-user-select: none;
    background: radial-gradient(circle, rgba(255,255,255,.06), rgba(12,15,32,.55)); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
  }
  body.touch #joy { display: block; }
  body.seated #joy, body.touring #joy { display: none !important; }
  #joyOpts { position: fixed; z-index: 21; left: max(22px, env(safe-area-inset-left, 0px)); bottom: calc(max(22px, env(safe-area-inset-bottom, 0px)) + 138px); display: none; gap: 8px; pointer-events: auto; }
  body.touch.entered #joyOpts { display: flex; }
  body.seated #joyOpts, body.touring #joyOpts { display: none !important; }
  #joyOpts button { height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: var(--glass); font-size: 12px; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
  #joyOpts button[aria-pressed="true"] { border-color: var(--gold); color: var(--gold); }
  body.joyRight #joy { left: auto; right: max(22px, env(safe-area-inset-right, 0px)); }
  body.joyRight #joyOpts { left: auto; right: max(22px, env(safe-area-inset-right, 0px)); }
  body.joyRight #toolbar { right: auto; left: max(18px, env(safe-area-inset-left, 0px)); }
  #joyKnob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: rgba(214,178,110,.35); border: 1px solid var(--gold); pointer-events: none; transition: transform .08s; }
  #joy.on #joyKnob { transition: none; background: rgba(214,178,110,.55); }
  #tourCap {
    position: fixed; z-index: 35; left: 50%; bottom: max(22px, env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 14px); opacity: 0; pointer-events: none;
    width: min(620px, calc(100vw - 32px)); text-align: center; padding: 20px 24px 16px; border-radius: 18px;
    background: rgba(10,12,26,.78); border: 1px solid rgba(214,178,110,.3); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    transition: opacity .6s, transform .6s;
  }
  #tourCap.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  #tourKicker { font-size: 10.5px; letter-spacing: .34em; text-transform: uppercase; color: var(--gold); }
  #tourText { font-family: var(--display); font-style: italic; font-size: clamp(20px, 2.6vw, 27px); line-height: 1.4; margin: 8px 0 14px; text-wrap: balance; }
  #tourCap .row { display: flex; gap: 10px; justify-content: center; }
  #tourCap button { padding: 9px 18px; border-radius: 999px; border: 1px solid var(--gold-soft); background: transparent; font-size: 12.5px; letter-spacing: .08em; }
  #tourCap #tourNext { background: rgba(214,178,110,.2); border-color: var(--gold); }
  body.touring .hud:not(#brand) { opacity: 0 !important; pointer-events: none !important; }
  body.touring #tooltip, body.touring #pill { display: none; }
  #rotateHint {
    position: fixed; z-index: 40; left: 50%; top: 42%; transform: translate(-50%, -50%) scale(.96); opacity: 0; pointer-events: none;
    padding: 18px 22px; border-radius: 16px; text-align: center; font-size: 14px; line-height: 1.5;
    background: rgba(10,12,26,.82); border: 1px solid var(--gold-soft); transition: opacity .5s, transform .5s;
  }
  #rotateHint.show { opacity: 1; transform: translate(-50%, -50%); pointer-events: auto; }
  #rotateHint .ic { font-size: 34px; display: block; margin-bottom: 6px; animation: tilt 1.8s ease-in-out infinite; }
  @keyframes tilt { 0%, 30% { transform: rotate(0); } 60%, 100% { transform: rotate(-90deg); } }
  #motDuJour { margin: 4px 0 22px; max-width: 520px; }
  #motDuJour .kicker { font-size: 10px; }
  #motDuJour .mot { font-family: var(--display); font-style: italic; font-size: clamp(19px, 2.6vw, 24px); color: var(--ivory); margin-top: 6px; line-height: 1.4; text-wrap: balance; }
  @media (orientation: landscape) and (max-height: 520px) {
    #intro { justify-content: flex-start; padding-top: max(14px, env(safe-area-inset-top, 0px)); }
    #introNames { font-size: 38px; margin: 8px 0 2px; }
    .rule { margin: 10px auto; }
    #motDuJour { margin: 0 0 12px; } #introNote { margin-top: 10px; }
    #brandNames { font-size: 15px; } #brandPlace { font-size: 9px; } #together { font-size: 11px; margin-top: 4px; }
    #hintBox { display: none; }
    #toolbar { bottom: max(10px, env(safe-area-inset-bottom, 0px)); gap: 6px; }
    .tool { height: 38px; min-width: 38px; padding: 0 12px; font-size: 12px; }
    .tool .lbl { display: none; }
    #joy { width: 112px; height: 112px; bottom: max(14px, env(safe-area-inset-bottom, 0px)); }
    #joyOpts { bottom: calc(max(14px, env(safe-area-inset-bottom, 0px)) + 120px); }
    #tooltip { bottom: max(10px, env(safe-area-inset-bottom, 0px)); width: min(380px, 46vw); padding: 10px 14px 12px; }
    #tipTitle { font-size: 19px; } #tipStory { -webkit-line-clamp: 2; font-size: 12.5px; }
    #pill { bottom: max(14px, env(safe-area-inset-bottom, 0px)); font-size: 12px; }
    #benchMsg { top: 5%; font-size: 19px; }
    .card { padding: 24px 22px 18px; } .card img, .card video { max-height: 46vh; } .card h2 { font-size: 26px; } .card .body { font-size: 17px; }
    #atelier { width: min(440px, 62vw); }
    #tourCap { padding: 12px 18px 10px; width: min(560px, 62vw); } #tourText { font-size: 19px; margin: 4px 0 8px; }
  }

  /* ─── Fenêtres (papier ivoire) ─── */
  #modal {
    position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
    padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
    background: rgba(4,6,14,.62); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    opacity: 0; visibility: hidden; transition: opacity .45s, visibility .45s;
  }
  #modal.show { opacity: 1; visibility: visible; }
  .card {
    position: relative; width: min(560px, 100%); max-height: 100%; overflow-y: auto;
    background: var(--paper); color: var(--paper-ink); border-radius: 18px; padding: 34px 30px 28px; text-align: center;
    box-shadow: 0 30px 90px rgba(0,0,0,.55); transform: translateY(16px) scale(.98); transition: transform .45s;
  }
  #modal.show .card { transform: none; }
  .card .x { position: absolute; top: 10px; right: 12px; width: 38px; height: 38px; border-radius: 50%; border: 0; background: transparent; font-size: 24px; color: var(--paper-muted); }
  .card .x:hover { background: rgba(0,0,0,.06); }
  .card img { display: block; width: auto; height: auto; max-width: 100%; max-height: 54vh; margin: 0 auto 18px; border-radius: 6px; box-shadow: 0 6px 22px rgba(0,0,0,.18); }
  .card video { display: block; width: 100%; max-height: 54vh; object-fit: contain; border-radius: 6px; margin-bottom: 18px; background: #111; }
  .card .k { font-size: 10.5px; letter-spacing: .32em; text-transform: uppercase; color: #a3814a; }
  .card h2 { font-family: var(--display); font-weight: 500; font-style: italic; font-size: 33px; line-height: 1.1; margin: 8px 0 12px; text-wrap: balance; }
  .card .body { font-family: var(--display); font-size: 20px; line-height: 1.55; color: #3c352c; white-space: pre-line; overflow-wrap: anywhere; }
  .card .by { margin-top: 16px; font-size: 12.5px; color: var(--paper-muted); }
  .card .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 22px; }
  .pbtn { padding: 11px 20px; border-radius: 999px; border: 1px solid #c9a96e; background: transparent; color: #6d5530; font-size: 12.5px; letter-spacing: .1em; text-transform: uppercase; }
  .pbtn:hover { background: rgba(201,169,110,.14); }
  .pbtn.solid { background: #2a241d; color: var(--paper); border-color: #2a241d; }
  .pbtn.warn { color: #9b3b3b; border-color: #d39a9a; }
  .card .list { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; text-align: left; }
  .item { padding: 14px 16px; border-radius: 12px; background: rgba(42,36,29,.05); border: 1px solid rgba(42,36,29,.08); }
  .item .t { font-family: var(--display); font-size: 21px; font-style: italic; }
  .item .s { font-size: 13px; color: var(--paper-muted); margin-top: 2px; }
  .item .m { font-family: var(--display); font-size: 18px; line-height: 1.5; white-space: pre-line; margin-top: 8px; overflow-wrap: anywhere; }
  .item.sealed { background: repeating-linear-gradient(135deg, rgba(110,20,36,.05) 0 10px, rgba(110,20,36,.09) 10px 20px); }
  .item.done .t { text-decoration: line-through; text-decoration-color: rgba(163,129,74,.6); }
  .card textarea, .card input[type=text] {
    width: 100%; margin-top: 14px; padding: 12px 14px; border-radius: 12px; border: 1px solid rgba(42,36,29,.18);
    background: #fffdf8; color: var(--paper-ink); font-family: var(--display); font-size: 19px; line-height: 1.45;
  }
  .card textarea { min-height: 96px; resize: vertical; }

  /* ─── Atelier ─── */
  #atelier {
    position: fixed; z-index: 45; top: 0; right: 0; bottom: 0; width: min(440px, 100vw);
    padding: max(18px, env(safe-area-inset-top, 0px)) max(20px, env(safe-area-inset-right, 0px)) max(18px, env(safe-area-inset-bottom, 0px)) 20px;
    background: rgba(13,17,38,.96); border-left: 1px solid rgba(214,178,110,.2);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    transform: translateX(105%); transition: transform .5s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column; gap: 14px;
  }
  #atelier.open { transform: none; }
  #atelier header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  #atelier header h2 { margin: 0; font-family: var(--display); font-weight: 500; font-size: 28px; font-style: italic; }
  #atelier .x { width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.14); background: transparent; font-size: 20px; }
  #tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  #tabs button { flex: none; padding: 8px 13px; border-radius: 999px; border: 1px solid rgba(255,255,255,.12); background: transparent; font-size: 12.5px; color: var(--muted); }
  #tabs button[aria-selected="true"] { color: var(--night); background: var(--gold); border-color: var(--gold); }
  #pane { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 2px; min-height: 0; }
  #pane .lead { font-size: 13.5px; line-height: 1.6; color: var(--muted); margin: 0; }
  .drop {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;

  /* ════ VIDÉOS LOURDES ════
     Le stockage de fichiers de la page Claude refuse les fichiers de plus de 20 Mo : au-delà, la vidéo est découpée
     en morceaux (texte), rangés comme des fichiers normaux, et recollée sur l'appareil au moment de la lire. */
  const VID_MAX = 500 * 1024 * 1024, VID_PART = 14 * 1024 * 1024;
  const isChunkedVideo = (id) => typeof id === 'string' && id.startsWith('vid:');

  async function storeVideo(file, progress) {
    if (!S.assets) throw { code: 'no_assets' };
    if (file.size > VID_MAX) throw { code: 'too_large', message: 'Vidéo trop lourde (500 Mo max)' };
    const type = videoType(file);
    if (file.size <= 19.5 * 1024 * 1024 || window.__chateauNetlify) { if (progress) progress('Envoi de la vidéo…'); return (await S.assets.upload(file, { type })).id; }
    const n = Math.ceil(file.size / VID_PART), parts = [];
    for (let i = 0; i < n; i++) {
      if (progress) progress(`Envoi de la vidéo ${Math.round(i / n * 100)} %…`);
      const b64 = await blobToB64(file.slice(i * VID_PART, (i + 1) * VID_PART));
      parts.push((await S.assets.upload(new Blob([b64], { type: 'text/plain' }), { type: 'text/plain' })).id);
    }
    const key = 'v' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
    await S.db.doc('videos/' + key).set({ parts, type, size: file.size, author: S.meId || null, createdAt: Date.now() });
    if (progress) progress('Vidéo envoyée');
    return 'vid:' + key;
  }
  const VIDURL = new Map();
  function videoSrc(id, progress) {
    if (!id) return Promise.resolve('');
    if (!isChunkedVideo(id)) return Promise.resolve('/_blob/' + id);
    if (VIDURL.has(id)) return VIDURL.get(id);
    const p = (async () => {
      const d = await S.db.doc('videos/' + id.slice(4)).get(); if (!d.exists) throw new Error('vidéo introuvable');
      const m = d.data(), bufs = [];
      for (let i = 0; i < m.parts.length; i++) {
        if (progress) progress(Math.round(i / m.parts.length * 100));
        const r = await fetch('/_blob/' + m.parts[i]); if (!r.ok) throw new Error('morceau manquant');
        bufs.push(b64ToBytes(await r.text()));
      }
      if (progress) progress(100);
      return URL.createObjectURL(new Blob(bufs, { type: m.type || 'video/mp4' }));
    })();
    VIDURL.set(id, p); p.catch(() => VIDURL.delete(id)); return p;
  }
  function deleteVideo(id) {

    if (isChunkedVideo(id)) { S.db.doc('videos/' + id.slice(4)).get().then((d) => { if (d.exists) (d.data().parts || []).forEach((a) => S.assets && S.assets.delete(a).catch(() => {})); S.db.doc('videos/' + id.slice(4)).delete().catch(() => {}); }).catch(() => {}); return; }
    if (S.assets) S.assets.delete(id).catch(() => {});
  }

  }
  async function saveSettings(patch) {
    const ref = S.db.doc('settings/main');
    const snap = await ref.get();
    if (snap.exists) await ref.update(patch); else await ref.set(Object.assign({}, patch));
  }

      refreshPlates(); setVideo(S.settings.video || null); updateIntro(); BG.sync(); applyStyle(); FX.cel = celebrationsToday(); scheduleRebuild(); if (!was) loaded(); else if (!S.entered) maybeReady();
    }, onErr);
    const coll = (name, key) => { let got = false; db.collection(name).onSnapshot((s) => { S[key] = s.docs.map((d) => Object.assign({ id: d.id }, d.data())); scheduleRebuild(); if (!got) { got = true; loaded(); } }, onErr); };
    coll('chapters', 'chapters'); coll('memories', 'memories'); coll('letters', 'letters'); coll('reasons', 'reasons'); coll('wishes', 'wishes');
    let gotS = false;
    coll('firsts', 'firsts'); coll('library', 'library'); coll('projects', 'projects'); coll('treasures', 'treasures'); coll('capsules', 'capsules'); coll('advent', 'advent'); coll('notes', 'notes');
    initRoom(cl);
    ['gamescores', 'quiz'].forEach((name) => db.collection(name).onSnapshot((sn) => { S[name] = sn.docs.map((d) => Object.assign({ id: d.id }, d.data())); refreshScoreboard(); }, onErr));
    db.collection('sounds').onSnapshot((sn) => {
      S.sounds = sn.docs.map((d) => Object.assign({ id: d.id }, d.data()));
      BG.sync(); fillSoundList(document.querySelector('#sndList'));
      if (!gotS) { gotS = true; loaded(); }
    }, onErr);
  }

  /* ════════════════════════════════════════════
     ACCUEIL : code secret, création, entrée
     ════════════════════════════════════════════ */
  (function introStars() {
    const c = $('#introStars'), ctx = c.getContext('2d'); let stars = [];
    const resize = () => { c.width = innerWidth * devicePixelRatio; c.height = innerHeight * devicePixelRatio; stars = Array.from({ length: 160 }, () => [Math.random() * c.width, Math.random() * c.height * .8, Math.random() * 1.4 + .3, Math.random() * 6]); };
    resize(); addEventListener('resize', resize);
    (function draw(t) {
      if ($('#intro').classList.contains('gone')) return;
      ctx.clearRect(0, 0, c.width, c.height);
      stars.forEach(([x, y, r, p]) => { ctx.globalAlpha = .35 + .5 * Math.abs(Math.sin(t / 1400 + p)); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, r * devicePixelRatio, 0, 7); ctx.fill(); });
      requestAnimationFrame(draw);
    })(0);
  })();

  function updateIntro() {
    const st = S.settings;
    const names = (st.names || 'Toi & Moi').split('&');
    const nm = $('#introNames'); nm.replaceChildren(document.createTextNode(names[0].trim()));
    if (names.length > 1) nm.append(' ', h('em', { text: '&' }), ' ', document.createTextNode(names.slice(1).join('&').trim()));
    const dd = $('#introDays');
    if (st.since) {
      const d0 = new Date(st.since + 'T00:00:00'), now = new Date(), days = Math.floor((now - d0) / 864e5);
      const anniv = d0.getDate() === now.getDate() && d0.getMonth() === now.getMonth() && now.getFullYear() > d0.getFullYear();
      dd.replaceChildren();
      if (anniv) { const y = now.getFullYear() - d0.getFullYear(); dd.append('✨ Aujourd\'hui, ', h('strong', { text: y + (y > 1 ? ' ans' : ' an') }), ' ensemble ✨'); }
      else if (days >= 0) dd.append('Ensemble depuis ', h('strong', { text: days.toLocaleString('fr-FR') + ' jours' }));
      if (celebrationsToday().bday) dd.append(document.createElement('br'), '🎂 ', h('strong', { text: 'Joyeux anniversaire, mon amour' }), ' 🎂');
    } else dd.textContent = '';
  }

  function maybeReady() {
    if (!S.ready.scene || !S.ready.data) return;
    updateIntro(); renderMot();
    const st = S.settings, btn = $('#enterBtn');
    if (!st.codeHash && S.isOwner && S.db && !ls.get('chateau-setup-skip')) { $('#gate').hidden = true; $('#setup').classList.add('on'); return; }
    btn.disabled = false; btn.textContent = 'Entrer dans notre histoire ✨';
    if (st.codeHash && ls.get('chateau-code') !== st.codeHash) { $('#codeInput').hidden = false; $('#rememberWrap').hidden = false; }
    else { $('#codeInput').hidden = true; $('#rememberWrap').hidden = true; }
  }

  $('#setup').addEventListener('submit', async (e) => {
    e.preventDefault();
    const n = $('#setNames').value.trim(), c1 = $('#setCode').value.trim(), c2 = $('#setCode2').value.trim();
    if (c1 !== c2) { toast('Les deux codes ne correspondent pas'); return; }
    if (c1.length < 3) { toast('Au moins 3 caractères'); return; }
    try { const patch = { names: n, since: $('#setSince').value || '', codeHash: await sha(c1) }; await saveSettings(patch); Object.assign(S.settings, patch); ls.set('chateau-code', patch.codeHash); $('#setup').classList.remove('on'); $('#gate').hidden = false; maybeReady(); toast('La première pierre est posée'); }
    catch (err) { toast('Impossible d\'enregistrer pour l\'instant'); }
  });
  $('#setupSkip').addEventListener('click', () => { ls.set('chateau-setup-skip', '1'); $('#setup').classList.remove('on'); $('#gate').hidden = false; maybeReady(); });

  async function tryEnter() {
    const st = S.settings, inp = $('#codeInput');
    if (st.codeHash && ls.get('chateau-code') !== st.codeHash) {
      const hs = await sha(inp.value || '');
      if (hs !== st.codeHash) { inp.classList.remove('shake'); void inp.offsetWidth; inp.classList.add('shake'); inp.value = ''; inp.placeholder = 'Ce n\'est pas notre code…'; return; }
      if ($('#rememberCode').checked) ls.set('chateau-code', hs);
    }
    enter();
  }
  $('#enterBtn').addEventListener('click', tryEnter);
  $('#codeInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') tryEnter(); });

  function enter() {
    unlockAudio(); Music.start();
    if (BG.active) setTimeout(() => BG.next(), 400);
    $('#intro').classList.add('gone'); document.body.classList.add('entered');
    const hint = $('#hintBox');
    hint.innerHTML = document.body.classList.contains('touch') ? 'Joystick ou toucher le sol : marcher<br>Glisser : regarder<br>Toucher un objet : interagir' : 'ZQSD, flèches ou clic au sol : marcher<br>Glisser la souris : regarder<br>Clic sur un objet : interagir';
    rotateHint();
    setTimeout(() => hint.classList.add('fade'), 12000);
    glide(new THREE.Vector3(0, EYE, 57), 0, .05, 3200, async () => {
      S.entered = true; controls(true);
      const auto = S.settings.tourAuto !== false && !S.isOwner && !!S.db;
      if (auto && !(await tourSeen())) { markTourSeen(); showNews(true); setTimeout(() => runTour().catch((e) => { console.error('visite', e); S.tour = false; document.body.classList.remove('touring'); controls(true); }), 700); }
      else { setTimeout(() => showNews().catch(() => {}), 900); if (S.isOwner && !ls.get('chateau-owner-tour-hint')) { ls.set('chateau-owner-tour-hint', '1'); setTimeout(() => toast('Astuce : Plan ✦ → ▶ Visite guidée, pour voir ce qu\'elle verra'), 6500); } }
    });
    if (S.canWrite && !S.memories.length) setTimeout(() => toast('Ouvre l\'Atelier ✎ pour accrocher votre premier souvenir'), 4500);
    const myClues = S.treasures.filter((t) => !t.found && t.author !== S.meId);
    if (myClues.length) setTimeout(() => toast('🗝️ Un trésor est caché pour toi. L\'indice est dans le Plan ✦'), 8000);
    if (FX.cel.fireworks) setTimeout(() => toast('✨ Regarde le ciel du jardin…'), 3800);
  }

  initData();
})();
</script>
