<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Passerelle — Dépôt entreprise</title>
<style>
  :root {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --border: #E2E8F0;
    --border-strong: #CBD5E1;
    --text: #0F172A;
    --text-secondary: #64748B;
    --primary: #2563EB;
    --primary-hover: #1D4ED8;
    --success: #16A34A;
    --success-bg: #F0FDF4;
    --warning: #D97706;
    --radius: 8px;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; }

  .topbar {
    background: var(--surface); border-bottom: 1px solid var(--border); padding: 14px 24px;
    font-weight: 600; font-size: 15px; position: sticky; top: 0; z-index: 5;
  }

  .conteneur { max-width: 1100px; margin: 0 auto; padding: 24px; }

  .grille { display: grid; grid-template-columns: 320px 1fr; gap: 20px; align-items: start; }
  @media (max-width: 860px) { .grille { grid-template-columns: 1fr; } }

  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; }
  .panel h2 { font-size: 13px; font-weight: 600; margin: 0 0 14px; }

  label { display: block; font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; }
  input[type=email], input[type=password], input[type=text], input[type=number], input[type=file] {
    width: 100%; padding: 8px 10px; font-size: 14px; font-family: inherit;
    border: 1px solid var(--border-strong); border-radius: 6px; margin-bottom: 12px; background: #fff;
  }
  input:focus { outline: 2px solid var(--primary); outline-offset: 1px; }

  .rang { display: flex; gap: 8px; }
  button {
    font-family: inherit; font-size: 13px; font-weight: 500; padding: 8px 14px;
    border-radius: 6px; border: 1px solid var(--border-strong); background: var(--surface);
    color: var(--text); cursor: pointer;
  }
  button:hover { background: var(--bg); }
  button.principal { background: var(--primary); color: #fff; border-color: var(--primary); }
  button.principal:hover { background: var(--primary-hover); }
  button:disabled { opacity: 0.5; cursor: default; }
  button.pleine-largeur { width: 100%; margin-bottom: 14px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; margin: 10px 0; }
  th, td { border-bottom: 1px solid var(--border); padding: 7px 6px; text-align: left; }
  th { color: var(--text-secondary); font-weight: 500; font-size: 12px; }
  select { padding: 5px 8px; border-radius: 5px; border: 1px solid var(--border-strong); font-family: inherit; }

  .apercu { font-family: var(--mono); font-size: 12px; color: var(--text-secondary); background: var(--bg); border: 1px dashed var(--border-strong); border-radius: 5px; padding: 8px; margin: 8px 0; overflow-x: auto; }

  .msg { font-size: 12px; color: var(--text-secondary); margin: 8px 0 0; }

  .item-projet {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px;
    background: var(--bg); cursor: pointer; text-align: left; width: 100%; margin-bottom: 8px;
  }
  .item-projet.actif { border-color: var(--primary); background: #EFF6FF; }
  .item-projet .titre { font-weight: 500; font-size: 13px; }
  .item-projet .sousinfo { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

  .barre-progres { height: 6px; background: var(--border); border-radius: 3px; overflow: hidden; margin: 10px 0; }
  .barre-progres .rempli { height: 100%; background: var(--success); }
  .ligne-stats { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-secondary); margin-bottom: 14px; }
  .badge-litige { color: var(--warning); }

  .vide { text-align: center; padding: 30px 10px; color: var(--text-secondary); font-size: 13px; }
</style>
</head>
<body>

  <div class="topbar">Passerelle — dépôt entreprise</div>

  <div class="conteneur">

    <div class="panel" id="bloc_auth" style="max-width:400px; margin-bottom:20px;">
      <h2>Connexion entreprise</h2>
      <label>Email</label>
      <input type="email" id="auth_email" value="startup@ia.fr">
      <label>Mot de passe</label>
      <input type="password" id="auth_password" value="motdepasse123">
      <div class="rang">
        <button onclick="creerCompte()">Créer un compte</button>
        <button class="principal" onclick="seConnecter()">Se connecter</button>
      </div>
      <p class="msg" id="auth_msg"></p>
    </div>

    <div class="grille" id="grille_principale" style="display:none;">

      <div class="panel">
        <button class="principal pleine-largeur" onclick="afficherDepot()">+ Nouveau projet</button>
        <h2>Mes projets</h2>
        <div id="liste_mes_projets"></div>
      </div>

      <div class="panel" id="panel_droit">
        <div class="vide">Sélectionne un projet ou dépose-en un nouveau.</div>
      </div>

    </div>

  </div>

<script>
let authHeader = sessionStorage.getItem('passerelle_auth_client') || null;
let schemaCourant = null;
let fichierSelectionne = null;
let projetsCache = [];
let projetSelectionne = null;

function construireAuthHeader(email, motdepasse) { return 'Basic ' + btoa(email + ':' + motdepasse); }

async function creerCompte() {
  const email = document.getElementById('auth_email').value;
  const password = document.getElementById('auth_password').value;
  const msg = document.getElementById('auth_msg');
  const res = await fetch('/auth/register', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email, password, role: 'client' }),
  });
  msg.textContent = res.ok ? 'Compte créé — connecte-toi.' : (await res.json()).detail;
}

async function seConnecter() {
  await tenterConnexion(construireAuthHeader(document.getElementById('auth_email').value, document.getElementById('auth_password').value));
}

async function tenterConnexion(header) {
  const msg = document.getElementById('auth_msg');
  const res = await fetch('/auth/me', { headers: { Authorization: header } });
  if (!res.ok) { msg.textContent = 'Email ou mot de passe incorrect.'; sessionStorage.removeItem('passerelle_auth_client'); return; }
  const moi = await res.json();
  if (moi.role !== 'client') { msg.textContent = "Ce compte n'est pas un compte entreprise."; return; }

  authHeader = header;
  sessionStorage.setItem('passerelle_auth_client', header);
  document.getElementById('bloc_auth').style.display = 'none';
  document.getElementById('grille_principale').style.display = 'grid';
  chargerMesProjets();
}

if (authHeader) tenterConnexion(authHeader);

async function chargerMesProjets() {
  const res = await fetch('/projects/mine', { headers: { Authorization: authHeader } });
  if (!res.ok) return;
  projetsCache = (await res.json()).projets;
  const liste = document.getElementById('liste_mes_projets');

  if (!projetsCache.length) { liste.innerHTML = '<div class="vide">Aucun projet déposé.</div>'; return; }

  liste.innerHTML = projetsCache.map(p => `
    <button class="item-projet ${p.project_id === projetSelectionne ? 'actif' : ''}" onclick="afficherProjet(${p.project_id})">
      <div><div class="titre">${p.titre}</div><div class="sousinfo">${p.lignes_completees}/${p.total_lignes} lignes</div></div>
    </button>
  `).join('');
}

function afficherProjet(id) {
  projetSelectionne = id;
  chargerMesProjets();
  const p = projetsCache.find(x => x.project_id === id);
  const pct = p.total_lignes ? Math.round(100 * p.lignes_completees / p.total_lignes) : 0;

  document.getElementById('panel_droit').innerHTML = `
    <h2>${p.titre}</h2>
    <div class="barre-progres"><div class="rempli" style="width:${pct}%"></div></div>
    <div class="ligne-stats">
      <span>${p.lignes_completees} / ${p.total_lignes} lignes traitées</span>
      ${p.lignes_litigieuses > 0 ? `<span class="badge-litige">${p.lignes_litigieuses} en désaccord entre étudiants</span>` : ''}
    </div>
    <button class="principal" ${p.pret_pour_export ? '' : (p.lignes_completees > 0 ? '' : 'disabled')} onclick="exporter(${p.project_id}, 'csv')">
      ${p.pret_pour_export ? 'Télécharger en CSV' : (p.lignes_completees > 0 ? 'Télécharger le partiel (CSV)' : 'Pas encore de ligne traitée')}
    </button>
    <button ${p.pret_pour_export ? '' : (p.lignes_completees > 0 ? '' : 'disabled')} onclick="exporter(${p.project_id}, 'xlsx')" style="margin-left:8px;">
      Télécharger en Excel
    </button>
  `;
}

async function exporter(projectId, format) {
  const res = await fetch(`/projects/${projectId}/export?format=${format}`, { headers: { Authorization: authHeader } });
  if (!res.ok) { alert((await res.json()).detail); return; }
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `projet_${projectId}_nettoye.${format}`; a.click();
  URL.revokeObjectURL(url);
}

function afficherDepot() {
  projetSelectionne = null;
  chargerMesProjets();
  document.getElementById('panel_droit').innerHTML = `
    <h2>Déposer un nouveau fichier</h2>
    <input type="file" id="fichier_csv" accept=".csv,.xlsx">
    <button onclick="analyserFichier()">Analyser le fichier</button>
    <p class="msg" style="margin-top:6px;">Formats acceptés : CSV, Excel (.xlsx)</p>
    <div id="etape2" style="display:none; margin-top:16px;">
      <table id="table_schema"></table>
      <p class="apercu" id="apercu_texte"></p>
      <label>Titre du projet</label>
      <input type="text" id="titre_projet" value="Nettoyage de données">
      <label>Prix par ligne (€)</label>
      <input type="number" id="prix_ligne" value="0.04" step="0.01">
      <button class="principal" onclick="validerEtLancer()">Lancer le nettoyage</button>
      <p class="msg" id="resultat"></p>
    </div>
  `;
}

async function analyserFichier() {
  const input = document.getElementById('fichier_csv');
  if (!input.files.length) { alert('Choisis un fichier CSV.'); return; }
  fichierSelectionne = input.files[0];

  const formData = new FormData();
  formData.append('fichier', fichierSelectionne);
  const res = await fetch('/projects/infer-schema', { method: 'POST', headers: { Authorization: authHeader }, body: formData });
  const data = await res.json();
  schemaCourant = data.schema_suggere;

  const table = document.getElementById('table_schema');
  table.innerHTML = '<tr><th>Colonne</th><th>Type détecté</th><th>Obligatoire</th></tr>';
  schemaCourant.columns.forEach((col, i) => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${col.name}</td>
      <td><select onchange="modifierType(${i}, this.value)">
        <option value="string" ${col.type==='string'?'selected':''}>Texte libre</option>
        <option value="regex" ${col.type==='regex'?'selected':''}>Email</option>
        <option value="date" ${col.type==='date'?'selected':''}>Date (AAAA-MM-JJ)</option>
        <option value="number" ${col.type==='number'?'selected':''}>Nombre</option>
      </select></td>
      <td><input type="checkbox" ${col.required?'checked':''} onchange="schemaCourant.columns[${i}].required = this.checked"></td>
    `;
    table.appendChild(tr);
  });

  document.getElementById('apercu_texte').textContent = JSON.stringify(data.apercu_lignes.slice(0, 2));
  document.getElementById('etape2').style.display = 'block';
}

function modifierType(idx, valeur) {
  const col = schemaCourant.columns[idx];
  col.type = valeur;
  if (valeur === 'regex') col.rule = '^[\\w.-]+@[\\w.-]+\\.\\w+$';
  else delete col.rule;
}

async function validerEtLancer() {
  const resEl = document.getElementById('resultat');
  resEl.textContent = 'Création du projet...';

  const projetRes = await fetch('/projects', {
    method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: authHeader },
    body: JSON.stringify({
      titre: document.getElementById('titre_projet').value,
      colonnes_schema: schemaCourant,
      prix_par_ligne: parseFloat(document.getElementById('prix_ligne').value),
    }),
  });
  const projet = await projetRes.json();

  resEl.textContent = 'Découpage du fichier en micro-tâches...';
  const formData = new FormData();
  formData.append('fichier', fichierSelectionne);
  const ingestRes = await fetch(`/projects/${projet.project_id}/ingest`, { method: 'POST', headers: { Authorization: authHeader }, body: formData });
  const ingest = await ingestRes.json();

  resEl.textContent = `Projet créé — ${ingest.nb_taches_creees} micro-tâches prêtes.`;
  await chargerMesProjets();
  setTimeout(() => afficherProjet(projet.project_id), 600);
}
</script>
</body>
</html>
